name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --no-fail-fast

      - name: Run app tests
        run: dotnet test apps\Winspot.App.Tests\Winspot.App.Tests.csproj -c Debug -p:Platform=x64

      - name: Build app
        run: dotnet build apps\Winspot.App\Winspot.App.csproj -c Debug -p:Platform=x64
